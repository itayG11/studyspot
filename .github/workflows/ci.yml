# Every push and pull request: the server's tests against a real PostgreSQL,
# the web app's checks, the whole site in a real browser, and the Docker
# image. A red check means something broke before anyone deploys it.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test-only values, not secrets of any real deployment.
  DATABASE_URL: postgresql+psycopg://studyspot:studyspot@localhost:5432/studyspot
  TEST_DATABASE_URL: postgresql+psycopg://studyspot:studyspot@localhost:5432/studyspot_test
  JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789
  CHECKIN_CODE_SECRET: ci-only-code-secret-0123456789abcdef01234567

jobs:
  server:
    name: Server (pytest, ruff, migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studyspot
          POSTGRES_PASSWORD: studyspot
          POSTGRES_DB: studyspot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studyspot" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      # The exact versions in the lock file, each checked against its hash;
      # then the app itself, with nothing new pulled in (--no-deps).
      - run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .
      - run: ruff check app tests
      - name: Migrations build the schema, and match the models
        run: |
          alembic upgrade head
          alembic check
      - run: pytest -q

  web:
    name: Web app (lint, types, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build # includes the type check (tsc -b)

  # Known vulnerabilities in the libraries we ship, a lock file that still
  # matches pyproject.toml, and no secret anywhere in the git history.
  security:
    name: Security (pip-audit, npm audit, lock file, secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history, for the secret scan
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pip install pip-tools==7.6.2 pip-audit==2.10.1
      - name: The lock files match pyproject.toml
        working-directory: backend
        # pip-compile keeps every pin it can, so this changes the files only
        # when pyproject.toml asks for something the lock does not have.
        run: |
          pip-compile -q --generate-hashes --strip-extras --allow-unsafe -o requirements.lock pyproject.toml
          pip-compile -q --generate-hashes --strip-extras --allow-unsafe --extra dev -o requirements-dev.lock pyproject.toml
          git diff --exit-code -- requirements.lock requirements-dev.lock
      - name: Known vulnerabilities in the server's libraries
        working-directory: backend
        run: pip-audit --strict -r requirements.lock --require-hashes --disable-pip
      - name: Known vulnerabilities in the libraries the browser gets
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate
      - name: No secret in the git history
        # A pinned release, checked against its published checksum.
        run: |
          curl -fsSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .

  browser:
    name: Whole site in a browser (Playwright, axe)
    runs-on: ubuntu-latest
    needs: [server, web]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studyspot
          POSTGRES_PASSWORD: studyspot
          POSTGRES_DB: studyspot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studyspot" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Database with both campuses
        working-directory: backend
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps -e .
          alembic upgrade head
          python -m app.seed
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: frontend
        env:
          PYTHON: python
        run: npx playwright test
      # The edge cases on a computer, a tablet and a phone, against the
      # production build served the way it is deployed (app.site).
      - name: Playwright, edge cases on three devices
        working-directory: frontend
        env:
          PYTHON: python
        run: npx playwright test -c playwright.edge.config.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7

  image:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    needs: [server, web]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studyspot
          POSTGRES_PASSWORD: studyspot
          POSTGRES_DB: studyspot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studyspot" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t studyspot .
      - name: Starts on an empty database and answers
        run: |
          docker run -d --name site --network host \
            -e DATABASE_URL=postgresql://studyspot:studyspot@localhost:5432/studyspot \
            -e JWT_SECRET -e CHECKIN_CODE_SECRET \
            -e SITE_URL=http://localhost:8000 studyspot
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/api/health && break; sleep 2; done
          curl -fsS http://localhost:8000/api/health
          curl -fsS -o /dev/null http://localhost:8000/spaces/1
          curl -fsS -D - -o /dev/null http://localhost:8000/ | grep -i "content-security-policy"
      - name: The container's log, when something above failed
        if: failure()
        run: docker logs site
