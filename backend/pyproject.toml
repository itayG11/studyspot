[project]
name = "studyspot-backend"
version = "0.1.0"
description = "StudySpot API: real-time occupancy and booking for campus study spaces"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx2>=2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
