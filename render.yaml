# Render Blueprint: the live demo site, one free web service.
# The database is on Neon (Render's free database is deleted after 30 days);
# its address is pasted in once, as DATABASE_URL. Steps: docs/DEPLOY.md.
services:
  - type: web
    name: studyspot
    runtime: docker
    plan: free
    region: frankfurt # the closest region to Israel
    healthCheckPath: /api/health
    envVars:
      # From Neon's dashboard, asked for when the Blueprint is created.
      - key: DATABASE_URL
        sync: false
      # Random 256-bit values made by Render, never seen by anyone.
      - key: JWT_SECRET
        generateValue: true
      - key: CHECKIN_CODE_SECRET
        generateValue: true
      # Visitors try everything in the demo campus (app/seed/demo.py).
      # The server refuses this for an institution with real sign-in rules.
      - key: DEMO_LOGIN_ENABLED
        value: "true"
      - key: DEMO_INSTITUTION
        value: demo
      # Any Google account that is not an institution's joins the demo
      # campus as a student (app/accounts.py); never one with sign-in rules.
      - key: OPEN_SIGN_IN_INSTITUTION
        value: demo
      # From Google Cloud, entered in Render's dashboard, never in this file.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # From the Anthropic Console, entered in Render's dashboard only: reading
      # a timetable from a photo (Claude). Without it the option is hidden.
      - key: ANTHROPIC_API_KEY
        sync: false
      # From openrouteservice.org (free plan), entered in Render's dashboard
      # only: real walking times between buildings. Without it, the estimate.
      - key: ORS_API_KEY
        sync: false
      # From Microsoft Entra (docs/AUTH_SETUP.md), also entered in Render's
      # dashboard only. Without them the Microsoft button stays hidden.
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      # Who runs the service (creates institutions, invites their admins):
      # Google addresses, comma-separated. Entered in the dashboard only.
      - key: SYSTEM_ADMIN_EMAILS
        sync: false
      # Three entries are added at the end of X-Forwarded-For before the
      # server sees it: the visitor (by Cloudflare), Cloudflare's edge (by
      # Render), and Render's own internal proxy. The visitor is the third from
      # the right. Measured on the live site on 27 Oct 2026 (/system, "בדיקת
      # כתובת הלקוח"): with "1" every visitor was counted as Render's internal
      # address. A smaller number counts a proxy (stricter, never fooled); a
      # larger one counts what the visitor wrote. docs/DEPLOY.md.
      - key: TRUSTED_PROXY_HOPS
        value: "3"
      # Work asked of the browser before an emailed sign-in code is sent
      # (backend/app/pow.py): about 2^18 tries, under a second on a computer
      # and a couple on a phone. A script asking for thousands of codes, to
      # use up the day's email quota, pays that for each one. docs/DEPLOY.md.
      - key: EMAIL_POW_BITS
        value: "18"
      # The site's address comes from Render itself (RENDER_EXTERNAL_URL).
